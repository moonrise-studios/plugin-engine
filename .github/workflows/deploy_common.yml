      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Gradle / Nexus credentials
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/gradle.properties
          nexusUsername=${{ secrets.NEXUS_USERNAME }}
          nexusPassword=${{ secrets.NEXUS_PASSWORD }}
          nexusSnapshotsUrl=https://repo.moonrise.gg/repository/maven-snapshots
          nexusReleasesUrl=https://repo.moonrise.gg/repository/maven-releases
          EOF

      - name: Modify paper version for release
        if: github.ref == 'refs/heads/release'
        run: |
          sed -i "s/\\(var apiVersion = \\\"[^\\\"]*\\)-SNAPSHOT\\\"/\\1\\\"/" paper/build.gradle.kts

      - name: Modify paper version for snapshot
        if: github.ref == 'refs/heads/snapshot'
        run: |
          sed -i "/var apiVersion = \\\".*-SNAPSHOT\\\"/! s/\\(var apiVersion = \\\"[^\\\"]*\\)\\\"/\\1-SNAPSHOT\\\"/" paper/build.gradle.kts

      - name: Modify paper version for experimental
        if: github.ref != 'refs/heads/release' && github.ref != 'refs/heads/snapshot'
        run: |
          short_sha="${GITHUB_SHA::7}"
          sed -i "s/\\(var apiVersion = \\\"[^\\\"]*\\)-SNAPSHOT\\\"/\\1\\\"/" paper/build.gradle.kts
          sed -i "s/\\(var apiVersion = \\\"[^\\\"]*\\)\\\"/\\1-${short_sha}\\\"/" paper/build.gradle.kts

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and deploy paper release
        if: github.ref == 'refs/heads/release'
        run: ./gradlew clean :paper:publish -PisRelease=true

      - name: Build and deploy paper snapshot
        if: github.ref == 'refs/heads/snapshot'
        run: ./gradlew clean :paper:publish -PisRelease=false

      - name: Build and deploy paper experimental
        if: github.ref != 'refs/heads/release' && github.ref != 'refs/heads/snapshot'
        run: ./gradlew clean :paper:publish -PisRelease=false -PnexusSnapshotsUrl=https://repo.moonrise.gg/repository/experimental

  deploy_bungee:
    needs: deploy_common
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Gradle / Nexus credentials
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/gradle.properties
          nexusUsername=${{ secrets.NEXUS_USERNAME }}
          nexusPassword=${{ secrets.NEXUS_PASSWORD }}
          nexusSnapshotsUrl=https://repo.moonrise.gg/repository/maven-snapshots
          nexusReleasesUrl=https://repo.moonrise.gg/repository/maven-releases
          EOF

      - name: Modify bungee version for release
        if: github.ref == 'refs/heads/release'
        run: |
          sed -i "s/\\(var apiVersion = \\\"[^\\\"]*\\)-SNAPSHOT\\\"/\\1\\\"/" bungeecord/build.gradle.kts

      - name: Modify bungee version for snapshot
