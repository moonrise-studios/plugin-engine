name: Deploy Common to Moonrise Nexus (Gradle)

on:
  push:
    branches:
      - '**'

jobs:
  deploy_common:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Configure Gradle / Nexus credentials
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/gradle.properties
          nexusUsername=${{ secrets.NEXUS_USERNAME }}
          nexusPassword=${{ secrets.NEXUS_PASSWORD }}
          nexusSnapshotsUrl=https://repo.moonrise.gg/repository/maven-snapshots
          nexusReleasesUrl=https://repo.moonrise.gg/repository/maven-releases
          EOF

      - name: Modify common version for release
        if: github.ref == 'refs/heads/release'
        run: |
          sed -i "s/\\(var apiVersion = \\\"[^\\\"]*\\)-SNAPSHOT\\\"/\\1\\\"/" common/build.gradle.kts

      - name: Modify common version for snapshot
        if: github.ref == 'refs/heads/snapshot'
        run: |
          sed -i "/var apiVersion = \\\".*-SNAPSHOT\\\"/! s/\\(var apiVersion = \\\"[^\\\"]*\\)\\\"/\\1-SNAPSHOT\\\"/" common/build.gradle.kts

      - name: Modify common version for experimental
        if: github.ref != 'refs/heads/release' && github.ref != 'refs/heads/snapshot'
        run: |
          short_sha="${GITHUB_SHA::7}"
          sed -i "s/\\(var apiVersion = \\\"[^\\\"]*\\)-SNAPSHOT\\\"/\\1\\\"/" common/build.gradle.kts
          sed -i "s/\\(var apiVersion = \\\"[^\\\"]*\\)\\\"/\\1-${short_sha}\\\"/" common/build.gradle.kts

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and deploy common release
        if: github.ref == 'refs/heads/release'
        run: ./gradlew clean :common:publish -PisRelease=true

      - name: Build and deploy common snapshot
        if: github.ref == 'refs/heads/snapshot'
        run: ./gradlew clean :common:publish -PisRelease=false

      - name: Build and deploy common experimental
        if: github.ref != 'refs/heads/release' && github.ref != 'refs/heads/snapshot'
        run: ./gradlew clean :common:publish -PisRelease=false -PnexusSnapshotsUrl=https://repo.moonrise.gg/repository/experimental

  deploy_paper:
    needs: deploy_common
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
