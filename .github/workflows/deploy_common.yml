          sed -i "s/\\(var apiVersion = \\\"[^\\\"]*\\)-SNAPSHOT\\\"/\\1\\\"/" bungeecord/build.gradle.kts
          sed -i "s/\\(var apiVersion = \\\"[^\\\"]*\\)\\\"/\\1-${short_sha}\\\"/" bungeecord/build.gradle.kts

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build and deploy bungee release
        if: github.ref == 'refs/heads/release'
